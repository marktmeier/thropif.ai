# OOi Person Matrix — 7 × 7 = 49 core cells
# The 00i questions applied to a human in the network.
# Each layer has 7 factors. Total: 49 cells at L2 depth.
# L3 = 49 × 7 = 343 (each factor validated). L4 = 2,401 (evidence). → 3,199 total.
#
# truth.rate = (L4.loyal evidence / L5.respect peer-measure) / L6.listening cost
# gold seal (L7) = all 7 Teaching factors verified
#
# ── TIME (Z axis) ──────────────────────────────────────────────────────────
# Every cell has a lifecycle. Time flows forward only. Nothing goes negative.
#
#   being ──→ existing ──→ verified ──→ stale ──→ Z
#   (born)    (data in)    (human OK)   (decaying)  (archived)
#
# States:
#   00i  = cell created, empty, question asked but not answered (score: 0)
#   0.1  = being — first data entered, unreviewed (score: 0.01-0.19)
#   0.2  = existing — data present, AI-scored (score: 0.20-0.59)
#   0.6  = verified — peer or expert confirmed (score: 0.60-0.89)
#   0.9  = re-verified — human gold-sealed (score: 0.90-1.00)
#   Z    = archived — truth.rate decayed below threshold, moved to _archive/
#
# Decay rules:
#   - Every cell has a `verified_at` timestamp
#   - truth.rate decays 0.01/day if not re-verified (configurable per layer)
#   - L1 (identity) decays SLOW (0.005/day — names don't change fast)
#   - L4 (evidence) decays MEDIUM (0.01/day — data ages)
#   - L6 (cost) decays FAST (0.02/day — prices change)
#   - When truth.rate < 0.05 → cell state = stale
#   - When truth.rate < 0.01 → cell moves to Z (_archive/)
#   - Re-verification resets truth.rate to the verified score
#   - Z is not death — archived cells can be recalled and re-scored
#
# Time tracking per cell:
#   created_at:   when the cell was first filled
#   updated_at:   last data change
#   verified_at:  last human/expert verification
#   verified_by:  who verified (person OOi ID)
#   decay_rate:   per-day decay (default by layer)
#   state:        00i | being | existing | verified | re-verified | stale | Z
#
# ── LIFECYCLE ──────────────────────────────────────────────────────────────
#
#   00i ─────→ being ─────→ existing ─────→ verified ─────→ re-verified
#   (empty)    (RAG scan)   (7 agents)      (expert)        (founder)
#     │           │             │               │                │
#     │           │             │               │                │
#     └───────────┴─────────────┴───────────────┴────────────────┘
#                                    │
#                              time passes
#                              no re-verification
#                                    │
#                                    ▼
#                                  stale ────→ Z (archive)
#
# The gradient: cyan (#5EE7FF) at 00i → gold (#C9A227) at re-verified
# 512 steps between them. Time dims the color. Re-verification brightens it.

# ── PER-LAYER DECAY RATES ─────────────────────────────────────────────────
decay:
  L1: 0.005    # identity changes slowly (name, role)
  L2: 0.008    # fairness track record — moderate decay
  L3: 0.010    # truthfulness — evidence ages at standard rate
  L4: 0.010    # loyalty — network behavior measured over time
  L5: 0.012    # respect — peer opinions shift
  L6: 0.015    # listening — responsiveness is recent or stale
  L7: 0.005    # teaching — legacy decays slowly (what you taught stays)

# ── CELL SCHEMA ────────────────────────────────────────────────────────────
# Every cell in every layer follows this structure:
cell_schema:
  score: 0.0           # 0.0 - 1.0 (the truth.rate of this cell)
  state: "00i"         # 00i | being | existing | verified | re-verified | stale | Z
  evidence: ""         # one-line evidence string
  source: ""           # where the evidence came from (path or agent ID)
  created_at: null     # ISO timestamp — when first data entered
  updated_at: null     # ISO timestamp — last change
  verified_at: null    # ISO timestamp — last human/expert verification
  verified_by: null    # person OOi ID who verified (e.g. "person.mark-meier")
  decay_rate: null     # override per-cell (null = use layer default)
  history: []          # array of {score, source, timestamp} — the L0 trail

L1.Giver:
  question: "What does this person GIVE to the network?"
  factors:
    skill:        "Primary expertise they contribute (formulation, medical, production, design, sales)"
    output:       "Tangible deliverables (formulas, reports, batches, designs, contracts)"
    availability: "How reachable and responsive (always-on vs. project-based)"
    initiative:   "Do they offer before being asked, or only when called"
    quality:      "Grade of what they deliver (precision, completeness, reliability)"
    volume:       "How much they contribute (high-volume like Anaïs vs. occasional)"
    uniqueness:   "What they give that nobody else in the network can"

L2.Fair:
  question: "Do they deal FAIRLY?"
  factors:
    promises_kept: "Delivery vs. commitment ratio — do they do what they say"
    payment:       "Pay on time, correct amounts, no games"
    pricing:       "Fair pricing for services/materials — not gouging the network"
    transparency:  "Open about limitations, delays, problems — no surprises"
    credit:        "Give credit where due — don't claim others' work"
    reciprocity:   "Give and take balanced — not just a taker"
    conflict:      "How they handle disagreements — fair resolution or power plays"

L3.Truthful:
  question: "Is what they say REAL?"
  factors:
    claims_verified: "Claims backed by evidence (e.g. 'stable' → stability data confirms?)"
    data_accuracy:   "Numbers they provide are correct (costs, timelines, test results)"
    no_fabrication:  "Never invent results or capabilities they don't have"
    source_citing:   "Can trace statements back to real data or experience"
    corrections:     "When wrong, do they correct publicly or hide the error"
    consistency:     "Same answer to different people — no two-faced behavior"
    silence:         "Say 'I don't know' when they don't, instead of guessing"

L4.Loyal:
  question: "Do they PREFER the network?"
  factors:
    network_first:     "Use network suppliers/partners before going outside"
    knowledge_sharing: "Share discoveries with the network, not hoard"
    referrals:         "Bring new business/people INTO the network"
    exclusivity:       "Don't work with direct competitors simultaneously"
    defense:           "Stand up for network members when challenged externally"
    longevity:         "Duration of relationship — months vs. years measured"
    crisis:            "How they behave when things go wrong — stay or flee"

L5.Respect:
  question: "Is their respect EARNED? (peer-measured, not self-declared)"
  factors:
    peer_rating:         "What other network members say about working with them"
    expertise_recognized: "Are they sought out for their specific knowledge"
    reliability_rep:     "Reputation for delivering — 'you can count on them'"
    mentorship:          "Do juniors seek their guidance — organic respect signal"
    conflict_resolution: "When disagreements arise, do others trust their judgment"
    network_weight:      "Consensus weight — how much their opinion moves decisions"
    return_rate:         "Do partners come back for repeat collaboration — retention"

L6.Listening:
  question: "Do they HEAR before they speak?"
  factors:
    feedback_response:     "When given feedback, do they adjust or resist"
    requirement_adherence: "Follow specs ('no Ferulic' → formulator complies?)"
    question_asking:       "Ask clarifying questions before assuming"
    adaptation:            "Change approach based on new information"
    communication_channel: "Respond on the channel you reach out on — don't disappear"
    turnaround:            "Speed of response — hours vs. days vs. weeks"
    implementation:        "Feedback → actual change in next delivery (not just acknowledged)"

L7.Teaching:
  question: "Do they make others BETTER?"
  factors:
    knowledge_transfer:  "Actively teach their expertise to network members"
    documentation:       "Leave written knowledge behind — not just oral"
    process_improvement: "Make the SYSTEM better, not just their output"
    mentoring:           "Invest time in developing less experienced members"
    innovation:          "Introduce new methods, ingredients, approaches"
    legacy_building:     "Build something that outlasts their involvement"
    multiplier:          "Their presence makes everyone around them more productive"
