# 00i Bottle/Primary Container Matrix
# OOi.Lens[Product.Physical.Part.Bottle]
#
# The primary container — bottle, tube, jar, airless pump.
# Holds the formula. First thing the user's hand touches.
# Connected to: packaging supplier, brand (design), product (compatibility)

categories:
  1.Material:     "Glass, PET, HDPE, PP, PCR, airless — material choice drives everything"
  2.Shape:        "Round, oval, square, custom — ergonomics, shelf presence, filling compatibility"
  3.Capacity:     "Volume (30ml, 50ml, 100ml), fill level, headspace, overage"
  4.Compatibility: "Formula-to-container — migration, sorption, leaching, light protection"
  5.Decoration:   "Silkscreen, hot stamp, spray coating, frosted, metallic — surface finish"
  6.Tooling:      "Mould cost, lead time, minimum order, exclusivity, modification capability"
  7.Sustainability: "Recyclability, PCR content, weight reduction, mono-material design"

L1.Giver:
  factors:
    material:       "Protects formula from degradation (light, oxygen, moisture)"
    shape:          "Feels right in hand — user experience at first touch"
    capacity:       "Right size for usage pattern (30ml serum vs 200ml body lotion)"
    compatibility:  "No interaction between formula and container over shelf life"
    decoration:     "Communicates brand quality — looks premium or clinical as intended"
    tooling:        "Available in required MOQ without excessive tooling investment"
    sustainability: "Meets retailer sustainability requirements (recyclability code)"

L2.Fair:
  factors:
    material:       "Material spec matches what's delivered — no substitution without notice"
    shape:          "Dimensions match technical drawing — fits carton box and shipper"
    capacity:       "Actual fill volume matches label claim (not overfilled to compensate)"
    compatibility:  "Compatibility tested on actual formula, not similar reference"
    decoration:     "Decoration matches approved artwork — color, position, registration"
    tooling:        "Tooling ownership clear in contract — who owns the mould?"
    sustainability: "Sustainability claims verified (actual PCR % not just supplier statement)"

L3.Truthful:
  factors:
    material:       "Material certificate on file — polymer type, grade, food-contact status"
    shape:          "Technical drawing revision-controlled and signed"
    capacity:       "Brimful and fill capacity measured and documented"
    compatibility:  "Migration/sorption test report on file (6-month contact study)"
    decoration:     "Color drawdown approved — Pantone reference matched"
    tooling:        "Mould specification documented — cavity count, steel grade, maintenance log"
    sustainability: "Recyclability assessment per target market recycling infrastructure"

L4.Loyal:
  factors:
    material:       "Uses network-approved container suppliers for volume leverage"
    shape:          "Standardizes shapes across SKU families where possible"
    capacity:       "Standardizes sizes (50ml across serums) to reduce tooling"
    compatibility:  "Shares compatibility data across similar formulas in portfolio"
    decoration:     "Uses consistent decoration method across brand for visual coherence"
    tooling:        "Shares tooling across SKUs where shape allows"
    sustainability: "Aligns sustainability targets across the brand portfolio"

L5.Respect:
  factors:
    material:       "Supplier quality rating — defect PPM, on-time delivery %"
    shape:          "Consumer perception — blind test vs competitor packaging"
    capacity:       "Retail shelf fit — accepted by Rossmann, pharmacy, online"
    compatibility:  "Formula stability IN container confirmed (not just in beaker)"
    decoration:     "Print/decoration quality consistent — no batch variation visible"
    tooling:        "Supplier responsiveness — modification turnaround time"
    sustainability: "Retailer sustainability audit passed"

L6.Listening:
  factors:
    material:       "Switched material when customer reports 'feels cheap'"
    shape:          "Redesigned when logistics reports breakage during transport"
    capacity:       "Adjusted fill when consumer feedback says 'runs out too fast'"
    compatibility:  "Changed container when 6-month data shows yellowing/migration"
    decoration:     "Updated decoration when brand refresh requires new design"
    tooling:        "Moved suppliers when quality or lead time consistently fails"
    sustainability: "Upgraded to PCR or mono-material when technology becomes available"

L7.Teaching:
  factors:
    material:       "Material selection guide documented for future SKU development"
    shape:          "Container shape library maintained — what works for which format"
    capacity:       "Size-to-usage matrix documented (serum=30ml, cream=50ml, cleanser=150ml)"
    compatibility:  "Compatibility database — which formulas work with which containers"
    decoration:     "Decoration method comparison documented (cost, durability, appearance)"
    tooling:        "Supplier evaluation template — how to assess a new packaging vendor"
    sustainability: "Sustainability decision framework — when to invest in greener packaging"
