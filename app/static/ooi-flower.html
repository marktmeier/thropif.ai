ong \u2014 stay or flee"}}, "L5.Respect": {"question": "Is their respect EARNED? (peer-measured, not self-declared)", "factors": {"peer_rating": "What other network members say about working with them", "expertise_recognized": "Are they sought out for their specific knowledge", "reliability_rep": "Reputation for delivering \u2014 'you can count on them'", "mentorship": "Do juniors seek their guidance \u2014 organic respect signal", "conflict_resolution": "When disagreements arise, do others trust their judgment", "network_weight": "Consensus weight \u2014 how much their opinion moves decisions", "return_rate": "Do partners come back for repeat collaboration \u2014 retention"}}, "L6.Listening": {"question": "Do they HEAR before they speak?", "factors": {"feedback_response": "When given feedback, do they adjust or resist", "requirement_adherence": "Follow specs ('no Ferulic' \u2192 formulator complies?)", "question_asking": "Ask clarifying questions before assuming", "adaptation": "Change approach based on new information", "communication_channel": "Respond on the channel you reach out on \u2014 don't disappear", "turnaround": "Speed of response \u2014 hours vs. days vs. weeks", "implementation": "Feedback \u2192 actual change in next delivery (not just acknowledged)"}}, "L7.Teaching": {"question": "Do they make others BETTER?", "factors": {"knowledge_transfer": "Actively teach their expertise to network members", "documentation": "Leave written knowledge behind \u2014 not just oral", "process_improvement": "Make the SYSTEM better, not just their output", "mentoring": "Invest time in developing less experienced members", "innovation": "Introduce new methods, ingredients, approaches", "legacy_building": "Build something that outlasts their involvement", "multiplier": "Their presence makes everyone around them more productive"}}}}};

const LAYERS=[
  {key:"L1.Giver",    s:"L1",name:"Giver",    c:"#22c55e"},
  {key:"L2.Fair",     s:"L2",name:"Fair",      c:"#84cc16"},
  {key:"L3.Truthful", s:"L3",name:"Truthful",  c:"#eab308"},
  {key:"L4.Loyal",    s:"L4",name:"Loyal",     c:"#f59e0b"},
  {key:"L5.Respect",  s:"L5",name:"Respect",   c:"#f97316"},
  {key:"L6.Listening",s:"L6",name:"Listening", c:"#ec4899"},
  {key:"L7.Teaching", s:"L7",name:"Teaching",  c:"#ef4444"},
];

// Cell counts at each depth ring (the hourglass shape within each spoke)
const RINGS=[
  {r:1, cells:1,  label:"L1"},  // outermost — identity (narrow)
  {r:2, cells:7,  label:"L2"},
  {r:3, cells:49, label:"L3"},
  {r:4, cells:343,label:"L4"},  // equator — widest
  {r:5, cells:49, label:"L5"},
  {r:6, cells:7,  label:"L6"},
  {r:7, cells:1,  label:"L7"},  // innermost — gold seal (narrow)
];

let cur=null, selSpoke=null;
const svg=document.getElementById('svg');
const sel=document.getElementById('sel');

Object.keys(DATA).sort().forEach(k=>{
  const o=document.createElement('option');o.value=k;o.textContent=DATA[k].name;sel.appendChild(o);
});
sel.onchange=()=>{selSpoke=null;cur=DATA[sel.value];render()};

function render(){
  if(!cur)return;
  let html='';
  
  // Gradient defs
  html+=`<defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--gold)" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
    </radialGradient>
  </defs>`;

  // Center glow
  html+=`<circle cx="0" cy="0" r="30" fill="url(#centerGlow)"/>`;
  html+=`<circle cx="0" cy="0" r="15" fill="var(--gold)" opacity="0.1" stroke="var(--gold)" stroke-width="0.5" stroke-opacity="0.3"/>`;
  html+=`<text x="0" y="3" text-anchor="middle" fill="var(--gold)" font-size="9" font-weight="700"
    font-family="'JetBrains Mono',monospace">OOi</text>`;

  // 7 spokes — each spoke is one 00i layer
  LAYERS.forEach((layer, spokeIdx)=>{
    const angle = (spokeIdx * (360/7)) - 90; // start at top
    const rad = angle * Math.PI / 180;
    const isSel = selSpoke === spokeIdx;
    const layerData = cur.layers[layer.key];
    const factors = layerData ? Object.keys(layerData.factors) : [];
    
    // Draw the hourglass along this spoke
    // Each ring is a segment at increasing distance from center
    const maxCells = 343; // L4 is max within a spoke
    const spokeLength = 320;
    const ringH = spokeLength / 7;
    
    RINGS.forEach((ring, ri)=>{
      const dist = 35 + ri * ringH; // distance from center
      const halfWidth = (ring.cells / maxCells) * 40 + 3; // min width 3, max ~43
      
      // Calculate the 4 corners of this ring segment (rotated trapezoid)
      const perpRad = (angle + 90) * Math.PI / 180;
      
      const innerDist = dist;
      const outerDist = dist + ringH - 2;
      
      // Next ring width (for smooth hourglass)
      const nextHalfWidth = ri < 6 ? (RINGS[ri+1].cells / maxCells) * 40 + 3 : halfWidth;
      
      const x1 = Math.cos(rad) * innerDist + Math.cos(perpRad) * halfWidth;
      const y1 = Math.sin(rad) * innerDist + Math.sin(perpRad) * halfWidth;
      const x2 = Math.cos(rad) * innerDist - Math.cos(perpRad) * halfWidth;
      const y2 = Math.sin(rad) * innerDist - Math.sin(perpRad) * halfWidth;
      const x3 = Math.cos(rad) * outerDist - Math.cos(perpRad) * nextHalfWidth;
      const y3 = Math.sin(rad) * outerDist - Math.sin(perpRad) * nextHalfWidth;
      const x4 = Math.cos(rad) * outerDist + Math.cos(perpRad) * nextHalfWidth;
      const y4 = Math.sin(rad) * outerDist + Math.sin(perpRad) * nextHalfWidth;
      
      // Draw the segment
      const opacity = isSel ? 0.35 : 0.12;
      html+=`<path d="M${x1},${y1} L${x4},${y4} L${x3},${y3} L${x2},${y2} Z"
        fill="${layer.c}" opacity="${opacity}" 
        stroke="${layer.c}" stroke-width="${isSel?1:0.5}" stroke-opacity="${isSel?0.6:0.15}"
        style="cursor:pointer;transition:all .2s"
        onclick="clickSpoke(${spokeIdx})"
        onmouseenter="this.setAttribute('opacity','${Math.min(opacity+0.15,0.5)}')"
        onmouseleave="this.setAttribute('opacity','${opacity}')">
        <title>${layer.s} ${ring.label} (${ring.cells} cells)</title>
      </path>`;
      
      // Factor dots at the equator ring (ri===3, the widest)
      if(ri === 3 && factors.length){
        const dotDist = dist + ringH/2;
        const dotX = Math.cos(rad) * dotDist;
        const dotY = Math.sin(rad) * dotDist;
        html+=`<circle cx="${dotX}" cy="${dotY}" r="${isSel?5:3}" 
          fill="${layer.c}" opacity="${isSel?0.9:0.5}"
          style="cursor:pointer" onclick="clickSpoke(${spokeIdx})"/>`;
      }
    });
    
    // Spoke label at the tip
    const labelDist = spokeLength + 45;
    const lx = Math.cos(rad) * labelDist;
    const ly = Math.sin(rad) * labelDist;
    html+=`<text x="${lx}" y="${ly-6}" text-anchor="middle" 
      fill="${layer.c}" font-size="${isSel?12:10}" font-weight="700" opacity="${isSel?1:0.6}"
      font-family="'JetBrains Mono',monospace" style="cursor:pointer" onclick="clickSpoke(${spokeIdx})">${layer.s}</text>`;
    html+=`<text x="${lx}" y="${ly+6}" text-anchor="middle" 
      fill="${layer.c}" font-size="8" opacity="${isSel?0.7:0.3}"
      font-family="'JetBrains Mono',monospace">${layer.name}</text>`;
    
    // Factor labels along spoke when selected
    if(isSel && factors.length){
      factors.forEach((fk,fi)=>{
        const fDist = 35 + fi * ringH + ringH/2;
        const fx = Math.cos(rad) * fDist;
        const fy = Math.sin(rad) * fDist;
        
        // Offset label perpendicular to spoke
        const labelOffset = 50;
        const lfx = fx + Math.cos(perpRad) * labelOffset;
        const lfy = fy + Math.sin(perpRad) * labelOffset;
        const perpRad2 = (angle + 90) * Math.PI / 180;
        
        html+=`<circle cx="${fx}" cy="${fy}" r="4" fill="${layer.c}" opacity="0.7"/>`;
        html+=`<line x1="${fx}" y1="${fy}" x2="${fx + Math.cos(perpRad2)*35}" y2="${fy + Math.sin(perpRad2)*35}" 
          stroke="${layer.c}" stroke-width="0.5" opacity="0.3"/>`;
        html+=`<text x="${fx + Math.cos(perpRad2)*40}" y="${fy + Math.sin(perpRad2)*40 + 3}" 
          text-anchor="${angle > 90 || angle < -90 ? 'end' : 'start'}"
          fill="${layer.c}" font-size="8" opacity="0.7"
          font-family="'JetBrains Mono',monospace">${fk}</text>`;
      });
    }
  });
  
  // Ring distance labels (hourglass depth indicators at one spoke)
  const refAngle = -90; // top spoke
  const refRad = refAngle * Math.PI / 180;
  RINGS.forEach((ring,ri)=>{
    const dist = 35 + ri * (320/7) + (320/7)/2;
    // Small arc at each ring distance
    html+=`<circle cx="0" cy="0" r="${dist}" fill="none" stroke="var(--line)" stroke-width="0.3" 
      stroke-dasharray="2 8" opacity="0.15"/>`;
  });

  svg.innerHTML=html;
}

function clickSpoke(idx){
  selSpoke = selSpoke===idx ? null : idx;
  render();
  
  const det = document.getElementById('detail');
  if(selSpoke !== null && cur){
    const layer = LAYERS[idx];
    const layerData = cur.layers[layer.key];
    if(!layerData){det.classList.add('closed');return;}
    
    det.classList.remove('closed');
    let html=`<div class="d-head">
      <h3 style="color:${layer.c}">${layer.s} — ${layer.name}</h3>
      <div class="q">${layerData.question}</div>
    </div>`;
    
    Object.entries(layerData.factors).forEach(([fk,desc],fi)=>{
      html+=`<div class="d-factor">
        <div class="k" style="color:${layer.c}">${layer.s}.${fi+1} ${fk}</div>
        <div class="v">${desc}</div>
      </div>`;
    });
    det.innerHTML=html;
  } else {
    det.classList.add('closed');
  }
}

// Zoom
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const vb=svg.viewBox.baseVal;
  const scale=e.deltaY>0?1.1:0.9;
  const cx=vb.x+vb.width/2, cy=vb.y+vb.height/2;
  vb.width*=scale;vb.height*=scale;
  vb.x=cx-vb.width/2;vb.y=cy-vb.height/2;
},{passive:false});

// Pan
let panning=false,panStart={};
svg.addEventListener('mousedown',e=>{
  if(e.target===svg||e.target.tagName==='circle'&&!e.target.onclick){
    panning=true;panStart={x:e.clientX,y:e.clientY,vx:svg.viewBox.baseVal.x,vy:svg.viewBox.baseVal.y};
  }
});
svg.addEventListener('mousemove',e=>{
  if(!panning)return;
  const vb=svg.viewBox.baseVal;
  const dx=(e.clientX-panStart.x)*vb.width/svg.clientWidth;
  const dy=(e.clientY-panStart.y)*vb.height/svg.clientHeight;
  vb.x=panStart.vx-dx;vb.y=panStart.vy-dy;
});
svg.addEventListener('mouseup',()=>panning=false);
svg.addEventListener('mouseleave',()=>panning=false);

if(sel.options.length){cur=DATA[sel.options[0].value];render();}
</script>
</body>
</html>
